[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "featureflow"
version = "0.1.0"
description = "A self-hosted ML feature store and model serving platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "redis[hiredis]>=5.0.0",
  "duckdb>=1.1.0",
  "pyarrow>=17.0.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "structlog>=24.4.0",
  "typer>=0.12.0",
  "rich>=13.8.0",
  "prometheus-client>=0.20.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
streaming = ["aiokafka>=0.12.0"]
ml = ["scikit-learn>=1.5.0", "xgboost>=2.1.0"]
serving = ["ray[serve]>=2.36.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "fakeredis>=2.24.0",
]

[project.scripts]
featureflow = "featureflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["featureflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
